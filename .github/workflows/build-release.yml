name: Build & Release

# 触发条件：
#   1. 推送 v* 标签 → 全平台构建 + 创建 Draft Release（草稿，需手动发布）
#   2. 手动触发（workflow_dispatch）→ 只构建，不建 Release，用于测试 CI 是否跑通
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops 创建 Release / 上传资源需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false           # 某平台失败不影响其它平台继续跑完
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - platform: macos-latest     # M 系列 ARM 芯片
            target: aarch64-apple-darwin
            label: macos-arm
          - platform: macos-latest     # Intel 芯片
            target: x86_64-apple-darwin
            label: macos-intel
    runs-on: ${{ matrix.platform }}
    env:
      # 草稿 Release 的说明正文，三个 job 都引用同一份，避免竞态丢内容。
      RELEASE_BODY: |
        ## 下载说明 / Download Guide

        按平台选择对应文件 / Pick the file for your platform:

        | 文件 / File | 平台 / Platform | 说明 / Description |
        |---|---|---|
        | `vsmreader.exe` | Windows | 🟢 绿色版，双击即用，免安装 / Portable, no install |
        | `*-setup.exe` | Windows | NSIS 安装包 / NSIS installer |
        | `*_aarch64.dmg` | macOS · Apple Silicon (M1/M2/M3) | 拖入 Applications 安装 / Drag to Applications |
        | `*_x64.dmg` | macOS · Intel | 拖入 Applications 安装 / Drag to Applications |
        | `Source code (zip/tar.gz)` | — | 源代码，普通用户无需下载 / Source code, not for end users |

        > 💡 Windows 用户推荐绿色版 `vsmreader.exe`，免安装、可随身携带（U 盘便携模式见 README）。
        > 💡 macOS 用户按芯片选择：M 系列选 `aarch64`，Intel 选 `x64`。
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - run: pnpm install --frozen-lockfile

      # 直接用 tauri CLI 构建，不经过 tauri-action。
      # 原因：tauri-action 只上传 bundle/ 里的安装包到 Release，会漏掉
      #       bundle/ 之外的绿色版裸 exe（vsmreader.exe）。
      # 一次构建同时产出：
      #   Windows → bundle/nsis/*.exe（NSIS 安装包）+ vsmreader.exe（绿色版）
      #   macOS   → bundle/dmg/*.dmg
      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }}

      # 调试：打印产物路径，确认绿色 exe 确实生成。
      # Windows runner 默认是 PowerShell，不认 ls/grep，显式用 bash。
      - name: List build output
        shell: bash
        run: |
          echo "=== release 目录 ==="
          ls -la src-tauri/target/${{ matrix.target }}/release | grep -iE 'vsmreader|\.exe' || true
          echo "=== bundle 目录 ==="
          ls -R src-tauri/target/${{ matrix.target }}/release/bundle || true

      # 按平台分别上传，避免跨平台 glob 匹配空时的歧义。
      # 三个 job 都往同一个 draft Release 追加文件，全部跑完后你确认再点「Publish」发布。
      - name: Upload Windows artifacts (NSIS + portable exe)
        if: matrix.label == 'windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          body: ${{ env.RELEASE_BODY }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/vsmreader.exe

      - name: Upload macOS artifacts (dmg)
        if: matrix.label != 'windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          body: ${{ env.RELEASE_BODY }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
