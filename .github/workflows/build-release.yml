name: Build & Release

# 触发条件：
#   1. 推送 v* 标签 → 全平台构建 + 创建 Draft Release（草稿，需手动发布）
#   2. 手动触发（workflow_dispatch）→ 只构建，不建 Release，用于测试 CI 是否跑通
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops 创建 Release / 上传资源需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false           # 某平台失败不影响其它平台继续跑完
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          - platform: macos-latest     # M 系列 ARM 芯片
            target: aarch64-apple-darwin
            label: macos-arm
          - platform: macos-latest     # Intel 芯片
            target: x86_64-apple-darwin
            label: macos-intel
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - run: pnpm install --frozen-lockfile

      # 直接用 tauri CLI 构建，不经过 tauri-action。
      # 原因：tauri-action 只上传 bundle/ 里的安装包到 Release，会漏掉
      #       bundle/ 之外的绿色版裸 exe（vsmreader.exe）。
      # 一次构建同时产出：
      #   Windows → bundle/nsis/*.exe（NSIS 安装包）+ vsmreader.exe（绿色版）
      #   macOS   → bundle/dmg/*.dmg
      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }}

      # 调试：打印产物路径，确认绿色 exe 确实生成。
      # Windows runner 默认是 PowerShell，不认 ls/grep，显式用 bash。
      - name: List build output
        shell: bash
        run: |
          echo "=== release 目录 ==="
          ls -la src-tauri/target/${{ matrix.target }}/release | grep -iE 'vsmreader|\.exe' || true
          echo "=== bundle 目录 ==="
          ls -R src-tauri/target/${{ matrix.target }}/release/bundle || true

      # 按平台分别上传，避免跨平台 glob 匹配空时的歧义。
      # 三个 job 都往同一个 draft Release 追加文件，全部跑完后你确认再点「Publish」发布。
      - name: Upload Windows artifacts (NSIS + portable exe)
        if: matrix.label == 'windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/vsmreader.exe

      - name: Upload macOS artifacts (dmg)
        if: matrix.label != 'windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
